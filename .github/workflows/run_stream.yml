name: 🚀 Run M3U8 Streamer

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL of the webpage to stream (e.g., https://example.com)'
        required: true
        type: string
      quality:
        description: 'Stream Quality (e.g., 240p, 480p, 720p, 1080p)'
        required: true
        default: '720p'
        type: choice
        options:
          - '240p'
          - '360p'
          - '480p'
          - '720p'
          - '1080p'
          - '1440p'
      duration:
        description: 'Duration to run in minutes (Max 360 mins on GitHub)'
        required: true
        default: '60'
        type: string

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright imageio-ffmpeg flask requests
          playwright install chromium

      - name: 🎬 Run Streamer
        run: |
          python cli_webpage_to_m3u8.py --url "${{ github.event.inputs.url }}" --quality "${{ github.event.inputs.quality }}" --duration "${{ github.event.inputs.duration }}"
