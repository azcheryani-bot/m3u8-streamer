name: 🚀 Run M3U8 Streamer

on:
  workflow_dispatch:
    inputs:
      url:
        description: '🌐 آدرس صفحه وب (مثال: https://example.com)'
        required: true
        type: string
      quality:
        description: '📺 کیفیت استریم'
        required: true
        type: choice
        default: '480p'
        options:
          - 240p
          - 360p
          - 480p
          - 720p
          - 1080p
          - 1440p
      timeout:
        description: '⏳ مدت زمان اجرا به دقیقه (حداکثر 360)'
        required: true
        default: '60'
        type: string

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 دریافت کدهای پروژه
        uses: actions/checkout@v4

      - name: 🐍 نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 نصب کتابخانه های مورد نیاز
        run: |
          python -m pip install --upgrade pip
          pip install flask imageio-ffmpeg playwright requests

      - name: 🌐 نصب مرورگر مخفی
        run: |
          playwright install chromium

      - name: 🎥 نصب FFmpeg در سیستم عامل
        run: |
          sudo apt update
          sudo apt install ffmpeg -y

      - name: 🚀 اجرای سرور استریم
        run: |
          python cli_webpage_to_m3u8.py "${{ github.event.inputs.url }}" "${{ github.event.inputs.quality }}" "${{ github.event.inputs.timeout }}"
